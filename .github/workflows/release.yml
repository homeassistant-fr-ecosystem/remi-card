name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        type: string
      release_title:
        description: "Release title (defaults to the tag name)"
        required: false
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Mettre à jour la version dans package.json et committer avant de créer le tag,
      # comme le faisait précédemment semantic-release.
      - name: Update package.json version
        id: version
        run: |
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#v}"
          node -e "const fs=require('fs');const p='package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='$VERSION';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): mettre à jour la version $VERSION"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          git push origin main

      # Le build doit être exécuté après la mise à jour de version et le commit
      # ("chore(release): mettre à jour la version X"), afin que le numéro de version
      # soit bien embarqué dans le bundle généré (dist/remi-card.js).
      - name: Build
        run: npm run build

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          artifacts: "dist/remi-card.js"
          generateReleaseNotes: true
          tag: ${{ inputs.tag_name }}
          commit: ${{ steps.version.outputs.sha }}
          name: ${{ inputs.release_title || inputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
